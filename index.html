<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC GIS Dashboard - Karvir Region</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw Plugin -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Map Controls & Custom Popups */
        .leaflet-container { font-family: inherit; }
        
        /* Custom Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #2563eb; }
        .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- TOP HEADER NAVBAR (Image 1 Style) -->
    <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-30 shrink-0 shadow-sm">
        <!-- Title -->
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-bold text-blue-600 tracking-tight">SMC GIS Dashboard</h1>
            <span class="text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-0.5 rounded-full border border-blue-200">Karvir Tehsil</span>
        </div>

        <!-- Top Right Badges (Image 1 Feature Counter Badges) -->
        <div class="flex items-center space-x-2 text-xs font-medium">
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full border border-slate-300 transition cursor-pointer">
                <span class="font-bold text-blue-600">26</span> Wards
            </div>
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full border border-slate-300 transition cursor-pointer">
                <span class="font-bold text-blue-600">39</span> Health Centers
            </div>
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full border border-slate-300 transition cursor-pointer">
                <span class="font-bold text-emerald-600">1,482</span> Total POIs
            </div>
            
            <button id="btn-analytics-modal" title="Analytics" class="ml-2 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg transition shadow-sm">
                <i class="fa-solid fa-chart-pie"></i>
            </button>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTAINER -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- LEFT SIDEBAR: LAYER CATALOG (Image 1 Style) -->
        <aside id="sidebar" class="w-72 bg-white border-r border-slate-200 flex flex-col z-20 shrink-0 shadow-md">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">LAYER CATALOG</h2>
                <span class="text-xs text-blue-600 font-semibold">Layers</span>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- BASE MAPS SECTION -->
                <div>
                    <h3 class="text-xs font-bold uppercase text-blue-600 tracking-wider mb-3">BASE MAPS</h3>
                    <div class="space-y-3 text-xs font-medium text-slate-700">
                        <div class="flex items-center justify-between">
                            <span>Google Satellite</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="base-chk-sat" checked onchange="switchBasemap('satellite')" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between">
                            <span>Google Terrain / Road</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="base-chk-road" onchange="switchBasemap('osm')" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <!-- MAP LAYERS SECTION -->
                <div>
                    <h3 class="text-xs font-bold uppercase text-blue-600 tracking-wider mb-3">MAP LAYERS</h3>
                    <div class="space-y-3.5 text-xs font-medium text-slate-700">
                        <!-- Buildings -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-slate-500 rounded-sm inline-block"></span>
                                <span>Buildings</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-building" checked onchange="toggleLayer('building', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Landuse -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-emerald-500 rounded-sm inline-block"></span>
                                <span>Landuse</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-landuse" checked onchange="toggleLayer('landuse', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Places -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-amber-600 rounded-full inline-block"></span>
                                <span>Places</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-places" checked onchange="toggleLayer('places', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- POIs -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-pink-500 rounded-full inline-block"></span>
                                <span>POIs</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-pois" checked onchange="toggleLayer('pois', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Railways -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-4 h-0.5 bg-rose-700 inline-block"></span>
                                <span>Railways</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-railway" checked onchange="toggleLayer('railway', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Roads -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-4 h-0.5 bg-amber-400 inline-block"></span>
                                <span>Roads</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-roads" checked onchange="toggleLayer('roads', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Water -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-orange-600 rounded-sm inline-block"></span>
                                <span>Water</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-sidebar-water" checked onchange="toggleLayer('water', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CENTER MAP CANVAS CONTAINER -->
        <main class="flex-1 relative h-full">
            <div id="map" class="w-full h-full"></div>

            <!-- TOP-RIGHT LAYER LEGEND CONTROL BOX (Image 2 Style) -->
            <div class="absolute top-4 right-4 bg-white/95 backdrop-blur-md p-3 rounded-lg border border-slate-300 shadow-lg z-30 text-xs w-56">
                <div class="space-y-2 font-medium text-slate-700">
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-water" checked onchange="toggleLayer('water', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-3 bg-orange-600 inline-block rounded-xs"></span>
                        <span>water</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-roads" checked onchange="toggleLayer('roads', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-0.5 bg-amber-400 inline-block"></span>
                        <span>roads</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-railway" checked onchange="toggleLayer('railway', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-0.5 bg-purple-600 inline-block"></span>
                        <span>Railway</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-landuse" checked onchange="toggleLayer('landuse', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-3 bg-emerald-600 inline-block rounded-xs"></span>
                        <span>landuse</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-contour" checked onchange="toggleLayer('contour', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-0.5 bg-amber-700 inline-block"></span>
                        <span>contour</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-building" checked onchange="toggleLayer('building', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-3 bg-slate-600 inline-block rounded-xs"></span>
                        <span>building</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-karvir" checked onchange="toggleLayer('karvir', this.checked)" class="rounded text-blue-600 focus:ring-0">
                        <span class="w-3 h-3 bg-red-600 inline-block rounded-xs"></span>
                        <span>karvir_clip — clipped</span>
                    </label>
                    <hr class="my-1 border-slate-200" />
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-googleroad" onchange="switchBasemap('osm')" class="rounded text-blue-600 focus:ring-0">
                        <span>Google Road</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-0.5 rounded">
                        <input type="checkbox" id="legend-googlesat" checked onchange="switchBasemap('satellite')" class="rounded text-blue-600 focus:ring-0">
                        <span>Google Satellite</span>
                    </label>
                </div>
            </div>

            <!-- ATTRIBUTE INSPECTOR POPUP CARD -->
            <div id="inspector-card" class="hidden absolute bottom-6 left-6 w-80 bg-white/95 backdrop-blur-md border border-slate-300 rounded-xl shadow-2xl z-30 overflow-hidden">
                <div class="bg-blue-600 px-4 py-2.5 text-white flex justify-between items-center">
                    <h3 class="text-xs font-bold uppercase tracking-wider" id="inspector-title">Feature Attributes</h3>
                    <button onclick="closeInspector()" class="text-white hover:text-slate-200">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-3 max-h-60 overflow-y-auto space-y-1.5 text-xs" id="inspector-body"></div>
            </div>
        </main>
    </div>

    <!-- ANALYTICS MODAL -->
    <div id="analytics-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-base">Karvir Spatial Distribution</h3>
                <button onclick="closeAnalyticsModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="h-64 relative">
                    <canvas id="landuseChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KARVIR_CENTER = [16.6978, 74.2243];
        const DEFAULT_ZOOM = 12;

        let map, selectedFeatureLayer = null;
        let mapLayers = {};
        let basemapLayers = {};

        // Synthetic Data representing Image 2 layers
        const geojson_karvir = {
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "properties": { "name": "Karvir Region", "district": "Kolhapur", "area_sqkm": 678.4 },
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[[74.1500, 16.6300], [74.2900, 16.6300], [74.3100, 16.7600], [74.1600, 16.7600], [74.1500, 16.6300]]]
                }
            }]
        };

        const geojson_landuse = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "type": "Agriculture", "area_ha": 450 }, "geometry": { "type": "Polygon", "coordinates": [[[74.1700, 16.6500], [74.2200, 16.6500], [74.2100, 16.6900], [74.1600, 16.6800], [74.1700, 16.6500]]] } },
                { "type": "Feature", "properties": { "type": "Urban Core", "area_ha": 310 }, "geometry": { "type": "Polygon", "coordinates": [[[74.2100, 16.6800], [74.2600, 16.6800], [74.2500, 16.7200], [74.2000, 16.7100], [74.2100, 16.6800]]] } }
            ]
        };

        const geojson_water = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "name": "Panchganga River Channel" }, "geometry": { "type": "Polygon", "coordinates": [[[74.1600, 16.7150], [74.2100, 16.7100], [74.2500, 16.7250], [74.2800, 16.7200], [74.2800, 16.7280], [74.2400, 16.7320], [74.2000, 16.7180], [74.1600, 16.7220], [74.1600, 16.7150]]] } }
            ]
        };

        const geojson_roads = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "name": "NH-48 Arterial" }, "geometry": { "type": "LineString", "coordinates": [[74.2300, 16.6300], [74.2350, 16.6800], [74.2400, 16.7300], [74.2450, 16.7600]] } }
            ]
        };

        const geojson_pois = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "name": "Mahalaxmi Temple Zone" }, "geometry": { "type": "Point", "coordinates": [74.2230, 16.6980] } },
                { "type": "Feature", "properties": { "name": "Rankala Lake Promenade" }, "geometry": { "type": "Point", "coordinates": [74.2060, 16.6920] } }
            ]
        };

        window.onload = function() {
            initMap();
        };

        function initMap() {
            map = L.map('map', { center: KARVIR_CENTER, zoom: DEFAULT_ZOOM, zoomControl: true });

            basemapLayers['satellite'] = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri Satellite', maxZoom: 18 }).addTo(map);
            basemapLayers['osm'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap', maxZoom: 19 });

            // Render Layers with Image 2 palette
            mapLayers['karvir'] = L.geoJSON(geojson_karvir, { style: { color: '#dc2626', weight: 2.5, fillColor: '#ef4444', fillOpacity: 0.55 }, onEachFeature: attachEvents }).addTo(map);
            mapLayers['landuse'] = L.geoJSON(geojson_landuse, { style: { color: '#16a34a', weight: 1.5, fillColor: '#22c55e', fillOpacity: 0.5 }, onEachFeature: attachEvents }).addTo(map);
            mapLayers['water'] = L.geoJSON(geojson_water, { style: { color: '#ea580c', weight: 1.5, fillColor: '#ea580c', fillOpacity: 0.8 }, onEachFeature: attachEvents }).addTo(map);
            mapLayers['roads'] = L.geoJSON(geojson_roads, { style: { color: '#f59e0b', weight: 3 }, onEachFeature: attachEvents }).addTo(map);
            mapLayers['pois'] = L.geoJSON(geojson_pois, {
                pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 6, fillColor: '#ec4899', color: '#be185d', weight: 1, opacity: 1, fillOpacity: 0.9 }),
                onEachFeature: attachEvents
            }).addTo(map);
        }

        function attachEvents(feature, layer) {
            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                const body = document.getElementById('inspector-body');
                const title = document.getElementById('inspector-title');
                title.innerText = feature.properties.name || "Feature Properties";
                let html = '';
                for (const [k, v] of Object.entries(feature.properties)) {
                    html += `<div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500 font-medium">${k}:</span><span class="font-bold text-slate-800">${v}</span></div>`;
                }
                body.innerHTML = html;
                document.getElementById('inspector-card').classList.remove('hidden');
            });
        }

        function closeInspector() {
            document.getElementById('inspector-card').classList.add('hidden');
        }

        function toggleLayer(layerKey, isChecked) {
            if (mapLayers[layerKey]) {
                isChecked ? map.addLayer(mapLayers[layerKey]) : map.removeLayer(mapLayers[layerKey]);
            }
            // Sync toggles across UI controls
            ['chk-sidebar-', 'legend-'].forEach(prefix => {
                const el = document.getElementById(prefix + layerKey);
                if (el) el.checked = isChecked;
            });
        }

        function switchBasemap(key) {
            for (let b in basemapLayers) map.removeLayer(basemapLayers[b]);
            map.addLayer(basemapLayers[key]);
            
            document.getElementById('base-chk-sat').checked = (key === 'satellite');
            document.getElementById('base-chk-road').checked = (key === 'osm');
            document.getElementById('legend-googlesat').checked = (key === 'satellite');
            document.getElementById('legend-googleroad').checked = (key === 'osm');
        }

        document.getElementById('btn-analytics-modal').addEventListener('click', () => {
            document.getElementById('analytics-modal').classList.remove('hidden');
            setTimeout(renderChart, 100);
        });

        function closeAnalyticsModal() {
            document.getElementById('analytics-modal').classList.add('hidden');
        }

        function renderChart() {
            const ctx = document.getElementById('landuseChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Agriculture', 'Urban Core', 'Water Bodies', 'Road Network'],
                    datasets: [{ label: 'Area / Length', data: [450, 310, 180, 142], backgroundColor: ['#22c55e', '#ef4444', '#ea580c', '#f59e0b'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
