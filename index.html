<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC GIS Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .leaflet-container { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Custom Leaflet Popup Box styling matching exact screenshot */
        .leaflet-popup-content-wrapper {
            padding: 0 !important;
            border-radius: 14px !important;
            box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.18), 0 4px 12px -2px rgba(0, 0, 0, 0.08) !important;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            width: 280px !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            width: 100% !important;
        }
        .leaflet-popup-tip {
            background: #ffffff;
        }
        .leaflet-container a.leaflet-popup-close-button {
            top: 10px !important;
            right: 12px !important;
            color: #94a3b8 !important;
            font-size: 16px !important;
            font-weight: normal;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #334155 !important;
        }

        /* Leaflet Control Position Tweaks */
        .leaflet-top.leaflet-left {
            top: 12px;
            left: 12px;
        }
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
            border-radius: 8px !important;
            overflow: hidden;
        }
        .leaflet-bar a {
            border-bottom: 1px solid #f1f5f9 !important;
            color: #334155 !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- TOP HEADER NAVBAR -->
    <header class="h-14 bg-white border-b border-slate-200 px-5 flex items-center justify-between z-30 shrink-0 shadow-xs">
        <!-- Dashboard Title -->
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-extrabold text-blue-600 tracking-tight">SMC GIS Dashboard</h1>
        </div>

        <!-- Top Right Badges (Exact pills from screenshot) -->
        <div class="flex items-center space-x-3 text-xs font-medium text-slate-600">
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full border border-slate-200 transition cursor-pointer shadow-xs">
                <span class="font-bold text-slate-800">26</span> Wards
            </div>
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full border border-slate-200 transition cursor-pointer shadow-xs">
                <span class="font-bold text-slate-800">39</span> Health Units
            </div>
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full border border-slate-200 transition cursor-pointer shadow-xs">
                <span class="font-bold text-slate-800">176</span> Schools
            </div>
            <div class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full border border-slate-200 transition cursor-pointer shadow-xs hidden md:block">
                <span class="font-bold text-slate-800">1,240</span> Buildings
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- LEFT SIDEBAR: LAYER CATALOG -->
        <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-20 shrink-0 shadow-sm">
            <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700">LAYER CATALOG</h2>
                <a href="#" class="text-xs text-blue-600 font-semibold hover:underline">Layers</a>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-3 space-y-5">
                <!-- BASE MAPS SECTION -->
                <div>
                    <h3 class="text-[11px] font-bold uppercase text-blue-600 tracking-wider mb-2.5">BASE MAPS</h3>
                    <div class="space-y-3 text-xs font-semibold text-slate-700">
                        <div class="flex items-center justify-between">
                            <span>Google Satellite</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="base-sat" checked onchange="switchBasemap('satellite')" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between">
                            <span>Google Terrain</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="base-terrain" onchange="switchBasemap('terrain')" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <!-- MAP LAYERS SECTION -->
                <div>
                    <h3 class="text-[11px] font-bold uppercase text-blue-600 tracking-wider mb-2.5">MAP LAYERS</h3>
                    <div class="space-y-3 text-xs font-medium text-slate-700">
                        <!-- Buildings -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-emerald-700 rounded-xs inline-block"></span>
                                <span class="font-semibold text-slate-700">Buildings</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-building" checked onchange="toggleLayer('building', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Landuse -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-lime-500 rounded-xs inline-block"></span>
                                <span class="font-semibold text-slate-700">Landuse</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-landuse" checked onchange="toggleLayer('landuse', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Places -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-stone-500 rounded-full inline-block border border-stone-600"></span>
                                <span class="font-semibold text-slate-700">Places</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-places" checked onchange="toggleLayer('places', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- pois -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-pink-500 rounded-full inline-block"></span>
                                <span class="font-semibold text-slate-700">pois</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-pois" checked onchange="toggleLayer('pois', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Pois_1 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-orange-500 rounded-xs inline-block"></span>
                                <span class="font-semibold text-slate-700">Pois_1</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-pois1" checked onchange="toggleLayer('pois1', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Railways -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-4 h-0.5 bg-rose-800 inline-block"></span>
                                <span class="font-semibold text-slate-700">Railways</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-railway" checked onchange="toggleLayer('railway', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Roads -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-4 h-0.5 bg-slate-600 inline-block"></span>
                                <span class="font-semibold text-slate-700">Roads</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-roads" checked onchange="toggleLayer('roads', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Trafic -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-emerald-500 rounded-full inline-block"></span>
                                <span class="font-semibold text-slate-700">Trafic</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-traffic" checked onchange="toggleLayer('traffic', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Transport -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-amber-200 border border-amber-400 rounded-xs inline-block"></span>
                                <span class="font-semibold text-slate-700">Transport</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-transport" checked onchange="toggleLayer('transport', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>

                        <!-- Water -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 bg-pink-600 rounded-xs inline-block"></span>
                                <span class="font-semibold text-slate-700">Water</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="chk-water" checked onchange="toggleLayer('water', this.checked)" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAP CANVAS -->
        <main class="flex-1 relative h-full">
            <div id="map" class="w-full h-full"></div>
        </main>
    </div>

    <script>
        const KARVIR_CENTER = [16.6850, 74.2200];
        const DEFAULT_ZOOM = 12;

        let map;
        let mapLayers = {};
        let basemapLayers = {};

        // Feature Data
        const bilewadiFeature = {
            "type": "Feature",
            "properties": {
                "osm_id": "10103582706",
                "code": "1004",
                "fclass": "hamlet",
                "population": "0",
                "name": "Bilewadi"
            },
            "geometry": {
                "type": "Point",
                "coordinates": [74.2700, 16.7150]
            }
        };

        const karvirZonePolygon = {
            "type": "Feature",
            "properties": {
                "name": "SMC Karvir Region"
            },
            "geometry": {
                "type": "Polygon",
                "coordinates": [
                    [
                        [74.2400, 16.7050],
                        [74.2800, 16.7200],
                        [74.2880, 16.7000],
                        [74.2850, 16.6800],
                        [74.2700, 16.6600],
                        [74.2750, 16.6400],
                        [74.2600, 16.6400],
                        [74.2620, 16.6700],
                        [74.2400, 16.6800],
                        [74.2100, 16.6850],
                        [74.2000, 16.6900],
                        [74.2400, 16.7050]
                    ]
                ]
            }
        };

        const poiPoints = {
            "type": "FeatureCollection",
            "features": [
                bilewadiFeature,
                { "type": "Feature", "properties": { "name": "Point 1", "osm_id": "10103582707", "code": "1005", "fclass": "village", "population": "1200" }, "geometry": { "type": "Point", "coordinates": [74.2750, 16.7080] } },
                { "type": "Feature", "properties": { "name": "Point 2", "osm_id": "10103582708", "code": "1006", "fclass": "suburb", "population": "3400" }, "geometry": { "type": "Point", "coordinates": [74.2680, 16.6950] } },
                { "type": "Feature", "properties": { "name": "Point 3", "osm_id": "10103582709", "code": "1007", "fclass": "hamlet", "population": "450" }, "geometry": { "type": "Point", "coordinates": [74.2720, 16.6750] } },
                { "type": "Feature", "properties": { "name": "Point 4", "osm_id": "10103582710", "code": "1008", "fclass": "hamlet", "population": "300" }, "geometry": { "type": "Point", "coordinates": [74.2780, 16.6600] } },
                { "type": "Feature", "properties": { "name": "Point 5", "osm_id": "10103582711", "code": "1009", "fclass": "hamlet", "population": "150" }, "geometry": { "type": "Point", "coordinates": [74.2600, 16.6800] } }
            ]
        };

        window.onload = function() {
            initMap();
        };

        function initMap() {
            map = L.map('map', { 
                center: KARVIR_CENTER, 
                zoom: DEFAULT_ZOOM, 
                zoomControl: true 
            });

            // Basemaps
            basemapLayers['satellite'] = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri Satellite',
                maxZoom: 18
            }).addTo(map);

            basemapLayers['terrain'] = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: 'OpenStreetMap',
                maxZoom: 19
            });

            // Main Pink Polygon Zone (Matching Screenshot)
            mapLayers['karvir_zone'] = L.geoJSON(karvirZonePolygon, {
                style: {
                    color: '#c026d3',
                    weight: 1.8,
                    fillColor: '#ec4899',
                    fillOpacity: 0.65
                }
            }).addTo(map);

            // POIs / Places Layer with custom popup exactly as in screenshot
            mapLayers['pois'] = L.geoJSON(poiPoints, {
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 5,
                        fillColor: '#ec4899',
                        color: '#701a75',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: function(feature, layer) {
                    layer.bindPopup(buildExactPopupHTML(feature.properties), {
                        maxWidth: 280,
                        className: 'custom-exact-popup'
                    });
                }
            }).addTo(map);

            // Auto-open Bilewadi Popup on load to match reference image exactly
            mapLayers['pois'].eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && layer.feature.properties.name === "Bilewadi") {
                    setTimeout(() => {
                        layer.openPopup();
                    }, 400);
                }
            });
        }

        // Generate Exact Popup HTML Structure matching screenshot
        function buildExactPopupHTML(props) {
            return `
                <div class="p-4 bg-white">
                    <!-- Top Pill Category Badge -->
                    <div class="inline-block bg-blue-50 text-blue-600 text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-100 tracking-wide uppercase mb-2">
                        PLACE • SMC ZONE
                    </div>

                    <!-- Title -->
                    <h3 class="text-lg font-bold text-slate-900 leading-tight mb-3">
                        ${props.name || 'Feature Attribute'}
                    </h3>

                    <!-- Key Value Properties Table -->
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between items-center py-0.5 border-b border-slate-100">
                            <span class="text-slate-500 font-medium">osm_id</span>
                            <span class="font-bold text-slate-800 tracking-tight">${props.osm_id || '10103582706'}</span>
                        </div>
                        <div class="flex justify-between items-center py-0.5 border-b border-slate-100">
                            <span class="text-slate-500 font-medium">code</span>
                            <span class="font-bold text-slate-800">${props.code || '1004'}</span>
                        </div>
                        <div class="flex justify-between items-center py-0.5 border-b border-slate-100">
                            <span class="text-slate-500 font-medium">fclass</span>
                            <span class="font-bold text-slate-800">${props.fclass || 'hamlet'}</span>
                        </div>
                        <div class="flex justify-between items-center py-0.5 border-b border-slate-100">
                            <span class="text-slate-500 font-medium">population</span>
                            <span class="font-bold text-slate-800">${props.population !== undefined ? props.population : '0'}</span>
                        </div>
                        <div class="flex justify-between items-center py-0.5">
                            <span class="text-slate-500 font-medium">name</span>
                            <span class="font-bold text-slate-800">${props.name || 'Bilewadi'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleLayer(layerKey, isChecked) {
            if (mapLayers[layerKey]) {
                isChecked ? map.addLayer(mapLayers[layerKey]) : map.removeLayer(mapLayers[layerKey]);
            }
        }

        function switchBasemap(key) {
            for (let b in basemapLayers) map.removeLayer(basemapLayers[b]);
            map.addLayer(basemapLayers[key]);
            
            document.getElementById('base-sat').checked = (key === 'satellite');
            document.getElementById('base-terrain').checked = (key === 'terrain');
        }
    </script>
</body>
</html>
